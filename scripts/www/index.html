<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>枣庄市人民检察院 · 控告申诉事项导引</title>
<style>
  :root{
    --gold:#d6b25a;
    --gold-soft:#c9a24b;
    --gold-dim:#8a6d35;
    --bg-top:#0b1426;
    --bg-bottom:#0a0f1e;
    --card-bg:rgba(255,255,255,0.09);
    --card-line:rgba(214,178,90,0.66);
    --text-main:#f2e8d0;
    --text-sub:#b9b09b;
    --text-dim:#8f8774;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;}
  body{
    font-family:'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','WenQuanYi Zen Hei',sans-serif;
    color:var(--text-main);
    background:radial-gradient(120% 90% at 50% 0%, #16233d 0%, #0c1526 45%, #0a0f1e 100%);
    position:relative;
    user-select:none;-webkit-user-select:none;
  }
  /* 极淡网格纹理 */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
    background-image:
      radial-gradient(circle at 50% 0%, rgba(214,178,90,0.08), transparent 45%),
      linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
    background-size:100% 100%, 64px 64px, 64px 64px;
  }
  .view{position:fixed;inset:0;display:none;}
  .view.active{display:flex;}

  /* ============ 首页 ============ */
  #home{flex-direction:column;padding:3.4vh 4vw 3vh;align-items:center;}
  .home-head{text-align:center;margin-top:0.6vh;}
  .logo-wrap{display:flex;justify-content:center;}
  .logo{height:10vh;width:auto;filter:drop-shadow(0 6px 16px rgba(0,0,0,.5));}
  .unit{font-size:3.6vh;font-weight:700;letter-spacing:1vh;margin-top:1.5vh;color:var(--text-main);text-shadow:0 2px 12px rgba(0,0,0,.4);}
  .subtitle{font-size:2.1vh;font-weight:400;letter-spacing:0.9vh;margin-top:1vh;color:var(--gold);}
  .head-divider{width:11vw;height:2px;margin:1.5vh auto 0;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);}
  .grid-wrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
    gap:1.8vh;width:100%;height:100%;max-height:100%;}
  .card{
    background:linear-gradient(165deg, rgba(255,255,255,0.10) 0%, rgba(22,33,54,0.55) 100%);
    border:2px solid rgba(214,178,90,0.62);
    border-radius:20px;
    box-shadow:0 14px 36px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,255,255,0.06);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:1.5vh 1vw;text-align:center;cursor:pointer;position:relative;overflow:hidden;
    transition:transform .15s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .card::before{content:"";position:absolute;top:0;left:14%;right:14%;height:2px;
    background:linear-gradient(90deg,transparent,rgba(214,178,90,0.75),transparent);}
  .card::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 0%, rgba(214,178,90,0.12), transparent 60%);opacity:0;transition:opacity .2s;}
  .card:hover{background:linear-gradient(165deg, rgba(214,178,90,0.18), rgba(22,32,52,0.5));border-color:var(--gold);box-shadow:0 16px 42px rgba(0,0,0,0.46), inset 0 1px 0 rgba(255,255,255,0.08);transform:translateY(-3px);}
  .card:hover::after{opacity:1;}
  .card:active{transform:scale(.97);}
  .card .num{font-size:3vh;font-weight:700;color:var(--gold);letter-spacing:.3vh;opacity:.95;}
  .card .ct{font-size:2.15vh;font-weight:600;line-height:1.4;color:var(--text-main);
    width:100%;display:block;text-align:center;margin-top:1.2vh;}
  .card .cg{font-size:1.45vh;color:var(--text-sub);margin-top:0.75vh;line-height:1.35;}
  .home-foot{font-size:1.5vh;letter-spacing:.4vh;color:var(--text-sub);padding-top:1.5vh;white-space:nowrap;}

  /* ============ 内容页 ============ */
  #detail{flex-direction:column;}
  .d-head{
    flex:0 0 auto;background:linear-gradient(180deg, rgba(0,0,0,0.25), rgba(0,0,0,0));
    padding:3.2vh 5vw 2vh;display:flex;align-items:center;justify-content:center;position:relative;
  }
  .d-title-wrap{text-align:center;}
  .d-title-wrap{text-align:center;}
  .d-sup{font-size:1.8vh;color:var(--gold);letter-spacing:1vh;margin-bottom:1vh;}
  .d-title{font-size:3.8vh;font-weight:700;letter-spacing:.4vh;color:var(--text-main);
    border-bottom:1px solid var(--card-line);padding-bottom:1.2vh;
    text-shadow:0 2px 10px rgba(0,0,0,.4);}
  .d-sub{font-size:1.9vh;color:var(--gold);letter-spacing:.4vh;margin-top:1.2vh;}
  .d-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:2vh 5.5vw 9vh;
    -webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--gold-dim) transparent;}
  .d-body::-webkit-scrollbar{width:1.2vh;}
  .d-body::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:6px;}
  .sec{margin-bottom:3.4vh;}
  .sec-title{display:flex;align-items:center;font-size:2.7vh;font-weight:700;color:var(--gold);
    letter-spacing:.4vh;margin-bottom:1.8vh;}
  .sec-title::before{content:"";flex:0 0 auto;width:4px;height:2.6vh;background:var(--gold);
    border-radius:2px;margin-right:1.2vw;box-shadow:0 0 10px rgba(214,178,90,.5);}
  .sec-items{list-style:none;}
  .sec-items li{
    font-size:2.15vh;line-height:1.9;color:var(--text-main);padding:0.35vh 0;
    padding-left:0;text-align:justify;
  }
  .sec-items li + li{border-top:1px dashed rgba(255,255,255,0.05);}

  /* 底部导航 */
  .d-nav{flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:2.4vw;
    padding:2vh 4vw 3vh;background:linear-gradient(0deg, rgba(0,0,0,0.35), rgba(0,0,0,0));
    border-top:1px solid rgba(214,178,90,0.15);}
  .nav-btn{
    display:flex;align-items:center;justify-content:center;gap:0.8vw;
    min-width:17vw;height:9.5vh;padding:0 2vw;border-radius:14px;cursor:pointer;
    font-size:2.3vh;font-weight:600;letter-spacing:.4vh;transition:transform .12s ease, background .2s;
    border:1px solid var(--card-line);color:var(--text-main);background:rgba(255,255,255,0.04);
  }
  .nav-btn:hover{background:rgba(214,178,90,0.14);border-color:var(--gold);}
  .nav-btn:active{transform:scale(.96);}
  .nav-btn.home{background:linear-gradient(160deg, #d6b25a, #a8842f);border:none;color:#1a1203;box-shadow:0 6px 18px rgba(214,178,90,.3);}
  .nav-btn.home:hover{background:linear-gradient(160deg, #e2c26a, #b8943a);}
  .nav-btn .ico{font-size:2.6vh;line-height:1;}
  .nav-btn:disabled{opacity:.3;cursor:default;transform:none;}

  /* 过渡动画 */
  .view.active #home, .view.active{animation:fadein .35s ease;}
  @keyframes fadein{from{opacity:0;}to{opacity:1;}}
</style>
</head>
<body>

<!-- ===== 首页 ===== -->
<div id="home" class="view active">
  <div class="home-head">
    <div class="logo-wrap"><img class="logo" src="assets/jianhui_transparent.png" alt="检徽"></div>
    <div class="unit">枣庄市人民检察院</div>
    <div class="subtitle">控告申诉事项导引</div>
    <div class="head-divider"></div>
  </div>
  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
  </div>
  <div class="home-foot">请选择您需要了解的事项 · 90秒无操作将自动返回首页</div>
</div>

<!-- ===== 内容页 ===== -->
<div id="detail" class="view">
  <div class="d-head">
    <div class="d-title-wrap">
      <div class="d-title" id="dTitle"></div>
      <div class="d-sub" id="dSub"></div>
    </div>
  </div>
  <div class="d-body" id="dBody"></div>
  <div class="d-nav">
    <button class="nav-btn" id="prevBtn"><span class="ico">◀</span>上一项</button>
    <button class="nav-btn home" id="homeBtn">&#8962; 返回首页</button>
    <button class="nav-btn" id="nextBtn">下一项<span class="ico">▶</span></button>
  </div>
</div>

<script src="data.js"></script>
<script>
(function(){
  var homeEl=document.getElementById('home');
  var detailEl=document.getElementById('detail');
  var gridEl=document.getElementById('grid');
  var dTitle=document.getElementById('dTitle');
  var dSub=document.getElementById('dSub');
  var dBody=document.getElementById('dBody');
  var dIndex=null;
  var prevBtn=document.getElementById('prevBtn');
  var nextBtn=document.getElementById('nextBtn');
  var homeBtn=document.getElementById('homeBtn');
  var AUTO=90000; // 90秒自动返回
  var timer=null;
  var cur=-1; // -1 首页

  // 首页标题排版配置（手动断行保证词汇完整）
  var T = [
    {fs:2.0, br:'民事裁判结果<br>监督'},
    {fs:2.2},
    {fs:2.6},
    {fs:2.6},
    {fs:1.85, br:'民事裁判结果监督<br>申请复查初核'},
    {fs:1.6, br:'民事审判（执行）<br>程序及人员违法监督'},
    {fs:2.2},
    {fs:2.6},
    {fs:2.2}
  ];
  // 渲染首页九宫格
  function renderHome(){
    gridEl.innerHTML='';
    DATA.forEach(function(b,idx){
      var cf=T[idx]||{fs:2.2};
      var c=document.createElement('div');
      c.className='card';
      c.innerHTML='<div class="num">'+b.num+'</div><div class="ct" style="font-size:'+cf.fs+'vh">'+(cf.br||b.title)+'</div>';
      c.onclick=function(){ resetTimer(); openDetail(idx); };
      gridEl.appendChild(c);
    });
  }

  // 打开板块
  function openDetail(i){
    if(i<0||i>=DATA.length) return;
    cur=i; var b=DATA[i];
    dTitle.textContent=b.title;
    dSub.textContent=b.tag||'';
    if(dIndex) dIndex.textContent='';
    var html='';
    b.sections.forEach(function(s){
      html+='<div class="sec"><div class="sec-title">'+s.t+'</div><ul class="sec-items">';
      s.items.forEach(function(it){ html+='<li>'+escapeHtml(it)+'</li>'; });
      html+='</ul></div>';
    });
    dBody.innerHTML=html;
    show(detailEl); hide(homeEl);
    dBody.scrollTop=0;
    updateNav();
    resetTimer();
  }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function goHome(){
    cur=-1; show(homeEl); hide(detailEl); resetTimer();
  }
  function prev(){ if(cur>0) openDetail(cur-1); }
  function next(){ if(cur<DATA.length-1) openDetail(cur+1); }
  function updateNav(){
    prevBtn.disabled=(cur<=0);
    nextBtn.disabled=(cur>=DATA.length-1);
  }
  function show(el){ el.classList.add('active'); }
  function hide(el){ el.classList.remove('active'); }

  // 90秒无操作自动返回
  function resetTimer(){
    if(timer) clearTimeout(timer);
    timer=setTimeout(function(){ goHome(); }, AUTO);
  }

  prevBtn.onclick=function(){ resetTimer(); prev(); };
  nextBtn.onclick=function(){ resetTimer(); next(); };
  homeBtn.onclick=function(){ resetTimer(); goHome(); };

  // 任意交互重置计时
  ['pointerdown','pointermove','touchstart','touchmove','wheel'].forEach(function(ev){
    document.addEventListener(ev, resetTimer, {passive:true});
  });

  renderHome();
  resetTimer();
})();
</script>
</body>
</html>
